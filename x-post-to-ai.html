<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ポスト→AIプロンプト</title>
<meta name="description" content="XのポストURLから本文・プロフィール・画像/動画を取得し、複数ポストを順番にまとめてClaude/ChatGPTに貼る文章を作るツール">
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--ink:#0f1419;--sub:#536471;--line:#e3e7ea;
  --accent:#1d9bf0;--accent-ink:#fff;--soft:#eef6fd;--warn:#b54708;--warn-bg:#fff6e5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0e11;--card:#16181c;--ink:#e7e9ea;--sub:#8b98a5;--line:#2f3336;
    --accent:#1d9bf0;--accent-ink:#fff;--soft:#10202e;--warn:#f5b041;--warn-bg:#2a2112;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0e11;--card:#16181c;--ink:#e7e9ea;--sub:#8b98a5;--line:#2f3336;
  --accent:#1d9bf0;--accent-ink:#fff;--soft:#10202e;--warn:#f5b041;--warn-bg:#2a2112;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
  line-height:1.6;font-size:15px}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:20px;margin:4px 0 2px}
.lead{color:var(--sub);font-size:13px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.4;cursor:default}
.muted{color:var(--sub);font-size:13px}
.err{color:var(--warn);background:var(--warn-bg);border-radius:10px;padding:10px 12px;font-size:14px;display:none;margin-top:10px;white-space:pre-wrap}
.hidden{display:none!important}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.post-head img{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;background:var(--line)}
.who{min-width:0;flex:1}
.aname{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ahandle{color:var(--sub);font-size:13px}
.ctrl{display:flex;gap:4px;flex:none}
.ctrl button{padding:4px 9px;font-size:13px}
.bio{white-space:pre-wrap;margin:4px 0;font-size:13px;color:var(--sub)}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;color:var(--sub);font-size:12px}
.meta b{color:var(--ink)}
.text{white-space:pre-wrap;font-size:15px;margin:10px 0;word-break:break-word}
.quote{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0}
.quote .text{font-size:14px;margin:4px 0}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.imgbox{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);position:relative}
.imgbox img{display:block;width:100%;height:140px;object-fit:cover;cursor:zoom-in}
.imgbox .lab{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;border-radius:6px;padding:1px 6px}
.imgbox .play{position:absolute;top:44px;left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;
  background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;pointer-events:none}
.imgbox .acts{display:flex;gap:6px;padding:6px;justify-content:center}
.imgbox .acts button{padding:3px 10px;font-size:12px}
.sec-title{font-weight:700;margin:0 0 6px;font-size:15px}
.opts{display:flex;flex-wrap:wrap;gap:6px 16px;margin:8px 0 10px;font-size:14px}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
#out{min-height:240px;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--sub);font-size:14px;padding:22px 0}
.list-head{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 8px}
a{color:var(--accent)}
@media (max-width:520px){
  .row{flex-wrap:wrap}.row input{flex:1 1 100%}.row button{flex:1}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>ポスト→AIプロンプト</h1>
  <p class="lead">XのポストURLを貼るたびに下へ追加されます。並んだ順（1→2→3…）にまとめて、Claude / ChatGPT に貼る文章を作ります。</p>

  <div class="card">
    <div class="row">
      <input id="url" type="text" placeholder="https://x.com/○○/status/1234567890" autocomplete="off" inputmode="url">
      <button id="go" class="primary">取得</button>
      <button id="clearUrl" title="入力欄を空にする">URL削除</button>
    </div>
    <div id="err" class="err"></div>
    <p class="muted" style="margin:8px 0 0">URLを貼り付けると自動で取得・追加します。鍵アカ・削除済みポストは取得できません。</p>
  </div>

  <div class="list-head">
    <span class="muted" id="count">0件</span>
    <button id="clearAll" disabled>すべて削除</button>
  </div>
  <div id="list"><div class="card empty">まだポストがありません</div></div>

  <div class="card" id="outCard">
    <p class="sec-title">AIに送る文章</p>
    <div class="opts">
      <label><input type="checkbox" id="oProfile" checked>プロフィール</label>
      <label><input type="checkbox" id="oStats" checked>日時・反応数</label>
      <label><input type="checkbox" id="oQuote" checked>引用元ポスト</label>
      <label><input type="checkbox" id="oMediaUrl">画像/動画のURL</label>
    </div>
    <textarea id="out" rows="14" spellcheck="false" placeholder="ポストを追加するとここに文章ができます"></textarea>
    <div class="btns">
      <button id="copy" class="primary">文章をコピー</button>
      <button id="openClaude">コピーしてClaudeを開く</button>
      <button id="openGpt">コピーしてChatGPTを開く</button>
    </div>
    <p class="muted" style="margin:8px 0 0">画像・動画は各ポストの「コピー」「保存」から、番号順にAIのチャットへ添付してください（ラベルの「1-画像1」などが文章中の番号と対応しています）。</p>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

let posts = [];
try{ posts = JSON.parse(store.get("xp_posts")||"[]") || []; }catch(e){ posts = []; }
const save = () => store.set("xp_posts", JSON.stringify(posts));

function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),1600);
}
function showErr(msg){ const e=$("err"); e.textContent=msg; e.style.display=msg?"block":"none"; }
function n(v){ return (v===undefined||v===null||v==="")?null:Number(v).toLocaleString("ja-JP"); }
function fmtDate(v){
  if(!v) return "";
  const d = typeof v==="number" ? new Date(v*1000) : new Date(v);
  if(isNaN(d)) return String(v);
  return d.toLocaleString("ja-JP",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
}
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function parseUrl(s){
  s = s.trim();
  if(/^\d{5,25}$/.test(s)) return {user:"i", id:s};
  const m = s.match(/(?:twitter|x|fxtwitter|fixupx|vxtwitter|fixvx)\.com\/(?:#!\/)?([^\/?#]+)\/status(?:es)?\/(\d+)/i);
  if(m) return {user:m[1], id:m[2]};
  const m2 = s.match(/\/i\/web\/status\/(\d+)/);
  if(m2) return {user:"i", id:m2[1]};
  return null;
}

/* ---------- 取得 ---------- */
function viaProxy(u){ return "https://api.allorigins.win/raw?url=" + encodeURIComponent(u); }
async function getJson(u, proxy){
  const r = await fetch(proxy ? viaProxy(u) : u, {cache:"no-store"});
  const txt = await r.text();
  let j = null; try{ j = JSON.parse(txt); }catch(e){}
  return {r, j};
}
async function fetchFx(user,id,proxy){
  const {r,j} = await getJson(`https://api.fxtwitter.com/${encodeURIComponent(user)}/status/${id}`, proxy);
  if(!j) throw new Error(`HTTP ${r.status}（JSONではない応答）`);
  if(!j.tweet){
    if(j.code===404 || r.status===404) throw new Error("ポストが見つかりません（削除・鍵アカ・URL違い）");
    throw new Error(j.message || ("HTTP "+r.status));
  }
  return normFx(j.tweet);
}
function normFx(t){
  const a = t.author||{};
  const photos = ((t.media&&t.media.photos)||[]).map(p=>({url:p.url, alt:p.altText||""}));
  const videos = ((t.media&&t.media.videos)||[]).map(v=>({thumb:v.thumbnail_url, url:v.url, type:v.type}));
  let article = null;
  if(t.article){
    const blocks = (t.article.content&&t.article.content.blocks)||[];
    article = {title:t.article.title||"", body:blocks.map(b=>b.text).filter(Boolean).join("\n\n")};
  }
  return {
    id:String(t.id), url:t.url || `https://x.com/${a.screen_name}/status/${t.id}`,
    text: t.raw_text?.text || t.text || "", article,
    date: t.created_timestamp || t.created_at,
    likes:t.likes, rts:t.retweets, replies:t.replies, views:t.views,
    replyingTo: t.replying_to || null,
    poll: t.poll ? t.poll.choices.map(c=>`${c.label}（${c.percentage}%）`) : null,
    photos, videos,
    author:{
      name:a.name, handle:a.screen_name, avatar:(a.avatar_url||"").replace("_normal","_400x400"),
      bio:a.description||"", location:a.location||"", website:(a.website&&(a.website.display_url||a.website.url))||"",
      followers:a.followers, following:a.following
    },
    quote: t.quote ? normFx(t.quote) : null
  };
}
async function fetchVx(user,id,proxy){
  const {r,j} = await getJson(`https://api.vxtwitter.com/${encodeURIComponent(user)}/status/${id}`, proxy);
  if(!j) throw new Error(`HTTP ${r.status}（JSONではない応答）`);
  if(!j.tweetID) throw new Error(j.error || j.message || ("HTTP "+r.status));
  return normVx(j);
}
function normVx(j){
  const me = j.media_extended||[];
  return {
    id:String(j.tweetID), url:j.tweetURL, text:j.text||"", article:null,
    date:j.date_epoch||j.date, likes:j.likes, rts:j.retweets, replies:j.replies, views:null,
    replyingTo:j.replyingTo||null, poll:null,
    photos: me.filter(m=>m.type==="image").map(m=>({url:m.url, alt:m.altText||""})),
    videos: me.filter(m=>m.type!=="image").map(m=>({thumb:m.thumbnail_url,url:m.url,type:m.type})),
    author:{name:j.user_name, handle:j.user_screen_name, avatar:(j.user_profile_image_url||"").replace("_normal","_400x400"),
      bio:"", location:"", website:"", followers:null, following:null},
    quote: j.qrt ? normVx(j.qrt) : null
  };
}
function withTimeout(pr, ms){
  return Promise.race([pr, new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),ms))]);
}
function describe(e){
  const m = String(e && e.message || e);
  if(e instanceof TypeError || /Failed to fetch|NetworkError|Load failed/i.test(m)) return "接続できません（通信ブロック／CORS）";
  if(m==="timeout") return "応答なし（10秒）";
  return m;
}

let busy = false;
async function load(){
  if(busy) return;
  showErr("");
  const p = parseUrl($("url").value);
  if(!p){ showErr("ポストのURLとして読み取れませんでした。…/status/数字 の形のURLを貼ってください。"); return; }
  if(posts.some(x=>x.id===p.id)){ showErr("このポストはすでに追加されています。"); return; }
  busy = true; $("go").disabled = true; $("go").textContent = "取得中…";
  const routes = [
    ["FxTwitter", ()=>fetchFx(p.user,p.id)],
    ["VxTwitter", ()=>fetchVx(p.user,p.id)],
    ["FxTwitter（中継経由）", ()=>fetchFx(p.user,p.id,true)],
    ["VxTwitter（中継経由）", ()=>fetchVx(p.user,p.id,true)],
  ];
  const errs = []; let got = null;
  for(const [name,fn] of routes){
    try{ got = await withTimeout(fn(), 10000); break; }
    catch(e){ errs.push(`${name}：${describe(e)}`); }
  }
  busy = false; $("go").disabled = false; $("go").textContent = "取得";
  if(got){
    posts.push(got); save();
    $("url").value = "";
    renderList(); build();
    toast(`${posts.length}件目を追加しました`);
    $("url").focus();
    return;
  }
  let hint = "";
  if(location.protocol==="file:") hint = "\n\n⚠ PCから直接開いています（file://）。GitHub Pagesなど https:// で開いてください。";
  else if(errs.every(s=>s.includes("接続できません"))) hint = "\n\n⚠ どの経路にも接続できていません。プレビュー画面や広告ブロッカーが原因の可能性があります。";
  showErr("取得できませんでした。\n" + errs.join("\n") + hint);
}

/* ---------- メディア ---------- */
function mediaOf(p, idx){
  // idx: 1始まりのポスト番号
  const list = [];
  p.photos.forEach((m,i)=>list.push({kind:"img", url:m.url, view:m.url, alt:m.alt, label:`${idx}-画像${i+1}`}));
  p.videos.forEach((v,i)=>list.push({kind:"video", url:v.url, view:v.thumb, alt:"", label:`${idx}-${v.type==="gif"?"GIF":"動画"}${i+1}`}));
  if(p.quote){
    p.quote.photos.forEach((m,i)=>list.push({kind:"img", url:m.url, view:m.url, alt:m.alt, label:`${idx}-引用元画像${i+1}`, fromQuote:true}));
    p.quote.videos.forEach((v,i)=>list.push({kind:"video", url:v.url, view:v.thumb, alt:"", label:`${idx}-引用元動画${i+1}`, fromQuote:true}));
  }
  return list;
}
function origUrl(u){
  if(/pbs\.twimg\.com\/media\//.test(u)){
    const base = u.split("?")[0];
    const m = base.match(/\.(jpg|jpeg|png|webp)$/i);
    if(m) return base.replace(/\.(jpg|jpeg|png|webp)$/i,"") + `?format=${m[1].toLowerCase()==="jpeg"?"jpg":m[1].toLowerCase()}&name=orig`;
  }
  return u;
}
async function getBlob(u){
  const r = await fetch(origUrl(u),{mode:"cors"});
  if(!r.ok) throw new Error("fetch");
  return await r.blob();
}
async function copyMedia(m){
  if(m.kind==="video"){ window.open(m.url,"_blank","noopener"); toast("動画はコピーできないため、新しいタブで開きました。保存して添付してください"); return; }
  try{
    const blob = await getBlob(m.url);
    const bmp = await createImageBitmap(blob);
    const c = document.createElement("canvas"); c.width=bmp.width; c.height=bmp.height;
    c.getContext("2d").drawImage(bmp,0,0);
    const png = await new Promise(res=>c.toBlob(res,"image/png"));
    await navigator.clipboard.write([new ClipboardItem({"image/png":png})]);
    toast(`${m.label}をコピーしました`);
  }catch(e){
    window.open(origUrl(m.url),"_blank","noopener");
    toast("コピーできないため、新しいタブで開きました");
  }
}
async function dlMedia(m){
  const ext = m.kind==="video" ? "mp4" : ((origUrl(m.url).match(/format=(\w+)/)||[,"jpg"])[1]);
  const name = `${m.label}.${ext}`;
  try{
    const blob = await getBlob(m.url);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  }catch(e){
    window.open(origUrl(m.url),"_blank","noopener");
  }
}

/* ---------- 一覧表示 ---------- */
function renderList(){
  $("count").textContent = `${posts.length}件`;
  $("clearAll").disabled = posts.length===0;
  if(!posts.length){ $("list").innerHTML = `<div class="card empty">まだポストがありません</div>`; return; }
  $("list").innerHTML = posts.map((p,i)=>{
    const a = p.author, idx = i+1;
    const am = [];
    if(n(a.followers)) am.push(`<span><b>${n(a.followers)}</b> フォロワー</span>`);
    if(n(a.following)) am.push(`<span><b>${n(a.following)}</b> フォロー</span>`);
    if(a.location) am.push(`<span>📍${esc(a.location)}</span>`);
    let body = "";
    if(p.replyingTo) body += `↩︎ @${p.replyingTo} への返信\n\n`;
    body += p.text;
    if(p.article) body += `\n\n【記事】${p.article.title}\n\n${p.article.body}`;
    if(p.poll) body += `\n\n【投票】\n・` + p.poll.join("\n・");
    const pm = [];
    if(p.date) pm.push(`<span>${esc(fmtDate(p.date))}</span>`);
    if(n(p.views)) pm.push(`<span><b>${n(p.views)}</b> 表示</span>`);
    if(n(p.likes)) pm.push(`<span><b>${n(p.likes)}</b> いいね</span>`);
    if(n(p.rts)) pm.push(`<span><b>${n(p.rts)}</b> RP</span>`);
    if(n(p.replies)) pm.push(`<span><b>${n(p.replies)}</b> 返信</span>`);
    pm.push(`<a href="${esc(p.url)}" target="_blank" rel="noopener">元のポスト</a>`);
    const media = mediaOf(p, idx);
    return `<div class="card">
      <div class="post-head">
        <div class="num">${idx}</div>
        <img src="${esc(a.avatar)}" alt="">
        <div class="who"><div class="aname">${esc(a.name)}</div><div class="ahandle">@${esc(a.handle)}</div></div>
        <div class="ctrl">
          <button data-up="${i}" ${i===0?"disabled":""} title="上へ">↑</button>
          <button data-down="${i}" ${i===posts.length-1?"disabled":""} title="下へ">↓</button>
          <button data-del="${i}" title="削除">✕</button>
        </div>
      </div>
      ${a.bio?`<div class="bio">${esc(a.bio)}</div>`:""}
      ${am.length?`<div class="meta">${am.join("")}</div>`:""}
      <div class="text">${esc(body)}</div>
      ${p.quote?`<div class="quote"><div class="muted">引用元：<b>${esc(p.quote.author.name)}</b> @${esc(p.quote.author.handle)}</div><div class="text">${esc(p.quote.text)}</div></div>`:""}
      ${media.length?`<div class="imgs">${media.map((m,k)=>`
        <div class="imgbox">
          <span class="lab">${esc(m.label)}</span>
          ${m.view?`<img src="${esc(m.view)}" alt="${esc(m.alt||m.label)}" data-open="${i}:${k}" loading="lazy">`:`<div style="height:140px"></div>`}
          ${m.kind==="video"?`<div class="play">▶</div>`:""}
          <div class="acts">
            <button data-copy="${i}:${k}">${m.kind==="video"?"開く":"コピー"}</button>
            <button data-dl="${i}:${k}">保存</button>
          </div>
        </div>`).join("")}</div>`:""}
      <div class="meta" style="margin-top:10px">${pm.join("")}</div>
    </div>`;
  }).join("");
}

/* ---------- 文章生成 ---------- */
function bodyLines(p, withStats){
  const L = [];
  if(withStats && p.date) L.push(`投稿日時：${fmtDate(p.date)}`);
  if(p.replyingTo) L.push(`返信先：@${p.replyingTo}`);
  L.push(`URL：${p.url}`);
  L.push('本文：');
  L.push('"""');
  L.push(p.text || "（本文なし）");
  if(p.article) L.push(`\n【記事タイトル】${p.article.title}\n${p.article.body}`);
  if(p.poll) L.push("\n【投票】\n・" + p.poll.join("\n・"));
  L.push('"""');
  if(withStats){
    const s = [];
    if(n(p.views)) s.push(`表示${n(p.views)}`);
    if(n(p.likes)) s.push(`いいね${n(p.likes)}`);
    if(n(p.rts)) s.push(`リポスト${n(p.rts)}`);
    if(n(p.replies)) s.push(`返信${n(p.replies)}`);
    if(s.length) L.push(`反応：${s.join(" / ")}`);
  }
  return L;
}
function build(){
  if(!posts.length){ $("out").value = ""; return; }
  const o = id => $(id).checked;
  const out = [];
  out.push(posts.length>1
    ? `以下はX（旧Twitter）のポスト${posts.length}件を、この順番（${posts.map((_,i)=>i+1).join("→")}）で並べたものです。`
    : "以下はX（旧Twitter）のポストです。");
  const seen = {};
  let mediaTotal = 0;
  posts.forEach((p,i)=>{
    const idx = i+1, a = p.author;
    const L = [`\n━━━━ ${idx}. ${a.name}（@${a.handle}） ━━━━`];
    if(o("oProfile")){
      if(seen[a.handle]){
        L.push(`プロフィール：${seen[a.handle]}と同じ人物`);
      }else{
        seen[a.handle] = `${idx}`;
        if(a.bio) L.push(`プロフィール：${a.bio.replace(/\n+/g," ")}`);
        const f = [];
        if(n(a.followers)) f.push(`フォロワー${n(a.followers)}`);
        if(n(a.following)) f.push(`フォロー${n(a.following)}`);
        if(a.location) f.push(`場所：${a.location}`);
        if(a.website) f.push(`Web：${a.website}`);
        if(f.length) L.push(f.join(" / "));
      }
    }
    L.push(...bodyLines(p, o("oStats")));
    if(p.quote && o("oQuote")){
      L.push(`▼ 引用元：${p.quote.author.name}（@${p.quote.author.handle}）`);
      L.push(...bodyLines(p.quote, o("oStats")));
    }
    const media = mediaOf(p, idx).filter(m => o("oQuote") || !m.fromQuote);
    if(media.length){
      mediaTotal += media.length;
      L.push("添付：" + media.map(m=>{
        let s = m.label;
        if(m.alt) s += `（代替テキスト：${m.alt}）`;
        if(o("oMediaUrl")) s += ` ${m.kind==="img"?origUrl(m.url):m.url}`;
        return s;
      }).join("、"));
    }
    out.push(L.join("\n"));
  });
  if(mediaTotal) out.push(`\n※画像・動画（計${mediaTotal}点）はこのメッセージに番号順で添付しています。`);
  $("out").value = out.join("\n");
}

async function copyOut(){
  const t = $("out").value;
  if(!t){ toast("まだ文章がありません"); return false; }
  try{ await navigator.clipboard.writeText(t); }
  catch(e){ $("out").select(); document.execCommand("copy"); }
  toast("コピーしました");
  return true;
}

/* ---------- イベント ---------- */
$("go").addEventListener("click",load);
$("url").addEventListener("keydown",e=>{ if(e.key==="Enter") load(); });
$("url").addEventListener("paste",()=>setTimeout(()=>{ if(parseUrl($("url").value)) load(); },0));
$("clearUrl").addEventListener("click",()=>{ $("url").value=""; showErr(""); $("url").focus(); });
$("clearAll").addEventListener("click",()=>{
  if(!confirm("追加したポストをすべて削除しますか？")) return;
  posts = []; save(); renderList(); build();
});
["oProfile","oStats","oQuote","oMediaUrl"].forEach(id=>$(id).addEventListener("input",build));
$("copy").addEventListener("click",copyOut);
$("openClaude").addEventListener("click",async()=>{ if(await copyOut()) window.open("https://claude.ai/new","_blank","noopener"); });
$("openGpt").addEventListener("click",async()=>{ if(await copyOut()) window.open("https://chatgpt.com/","_blank","noopener"); });
$("list").addEventListener("click",e=>{
  const b = e.target.closest("[data-up],[data-down],[data-del],[data-copy],[data-dl],[data-open]");
  if(!b) return;
  const d = b.dataset;
  const pick = s => { const [i,k] = s.split(":").map(Number); return mediaOf(posts[i], i+1)[k]; };
  if(d.up!==undefined){ const i=+d.up; [posts[i-1],posts[i]]=[posts[i],posts[i-1]]; }
  else if(d.down!==undefined){ const i=+d.down; [posts[i+1],posts[i]]=[posts[i],posts[i+1]]; }
  else if(d.del!==undefined){ posts.splice(+d.del,1); }
  else if(d.copy){ return copyMedia(pick(d.copy)); }
  else if(d.dl){ return dlMedia(pick(d.dl)); }
  else if(d.open){ const m = pick(d.open); return window.open(m.kind==="img"?origUrl(m.url):m.url,"_blank","noopener"); }
  save(); renderList(); build();
});

// 初期化
renderList(); build();
const q = new URLSearchParams(location.search).get("url");
if(q){ $("url").value = q; load(); }
</script>
